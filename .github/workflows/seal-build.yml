name: seal-build
on:
  workflow_dispatch: {}
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '10'
      - name: Pack
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: merge-deep-3.0.2
          path: merge-deep-3.0.2.tgz
          if-no-files-found: error
